[project]
name = "homehunt"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0.3", "httpx>=0.28.1", "pydantic>=2.14"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
homehunt = "homehunt.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
